name: Checks

# Feature-branch and pull-request checks. This workflow never deploys.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  structural:
    name: Build and structural checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify

  browser:
    name: Rendered, interaction and no-JS checks
    runs-on: ubuntu-latest
    needs: structural
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # System libraries required by the bundled Chromium binary.
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          PACKAGES="libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2"
          # libasound2 was renamed libasound2t64 on Ubuntu 24.04; accept either.
          sudo apt-get install -y --no-install-recommends $PACKAGES libasound2t64 \
            || sudo apt-get install -y --no-install-recommends $PACKAGES libasound2

      - run: npm run build

      - name: Serve the production build
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4321/; then
              echo "preview ready"; exit 0
            fi
            sleep 1
          done
          echo "preview did not start"; exit 1

      - name: Rendered checks
        env:
          BASE_URL: http://127.0.0.1:4321
        run: |
          node scripts/rendered-checks.mjs check
          node scripts/rendered-checks.mjs interact
          node scripts/rendered-checks.mjs nojs
          node scripts/rendered-checks.mjs zoom
